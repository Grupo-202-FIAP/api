apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "fastfood-api"
        metrics_path: "/actuator/prometheus"
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_namespace]
            action: keep
            regex: fastfood-api;default
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8080"